<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad con Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container bg-white border rounded p-4 shadow-sm">
        
        <h1 class="text-center text-primary mb-4">Actividad con Bootstrap 5</h1>

        <div class="row mb-5 g-0">
            <div class="col-md-6">
                <div class="p-3 border border-success h-100">
                    <h3 class="text-success">Columna 1</h3>
                    <p>Esta es la primera columna. Contiene texto con un borde y padding.</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 border border-danger h-100">
                    <h3 class="text-danger">Columna 2</h3>
                    <p>Esta es la segunda columna. También tiene un borde y padding.</p>
                </div>
            </div>
        </div>

        <div class="text-center mb-5">
            <div class="position-relative d-inline-block">
                <img src="../img/perfil.jpg" 
                     class="rounded-circle border border-secondary p-1 img-perfil" 
                     alt="Usuario" style="width: 150px; height: 150px; object-fit: cover;">
                
                <div class="mt-2">
                    <button class="btn btn-primary btn-sm">Haz clic aquí</button>
                </div>
            </div>
        </div>

        <h3 class="text-info">Tabla de Datos</h3>
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Edad</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Ana</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Juan</td>
                    <td>30</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>María</td>
                    <td>22</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
